# Decant Temcy: PostgreSQL + backend + frontend/Nginx. CONTOH, belum dijalankan dari sandbox.
#
# Persiapan:
#   cp backend/.env.example backend/.env      # isi nilainya (jangan di-commit)
#   Taruh sertifikat TLS di deploy/certs/fullchain.pem dan privkey.pem (mis. dari Let's Encrypt)
#   Taruh skema basis data (hasil pg_dump --schema-only dari pgAdmin) di deploy/initdb/schema.sql
#     -> dijalankan otomatis HANYA saat volume database masih kosong (tabel inti dibuat manual, bukan oleh app)
#
# Menjalankan (satu berkas env dipakai untuk compose dan backend):
#   docker compose --env-file backend/.env up -d --build
#
# Variabel yang dibaca compose dari backend/.env: DB_NAME, DB_USER, DB_PASSWORD, VITE_API_URL, VITE_MIDTRANS_CLIENT_KEY

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      # Nilai di bawah menimpa backend/.env agar backend menemukan database di jaringan compose
      DB_HOST: db
      DB_PORT: "5432"
      NODE_ENV: production
      PORT: "5000"
      TRUST_PROXY: "1"        # satu proxy (Nginx) di depan: req.ip diambil dari X-Forwarded-For
    volumes:
      - uploads:/app/uploads
    expose:
      - "5000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_MIDTRANS_CLIENT_KEY: ${VITE_MIDTRANS_CLIENT_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:
