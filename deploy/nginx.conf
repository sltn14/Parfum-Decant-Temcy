# Contoh Nginx untuk Decant Temcy (dipasang compose sebagai /etc/nginx/conf.d/default.conf).
# Ganti example.com dengan domain asli. Sertifikat dibaca dari deploy/certs/.
# Alamat API publik = domain yang sama, jadi set VITE_API_URL=https://example.com saat build frontend
# dan CLIENT_URL=https://example.com di backend/.env (untuk CORS).

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Unggah gambar produk/avatar (multer); sesuaikan dengan batas di backend
  client_max_body_size 6m;

  root /usr/share/nginx/html;
  index index.html;

  # Header yang dibaca backend (TRUST_PROXY=1) untuk IP klien
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # REST API (termasuk webhook Midtrans: /api/orders/webhook)
  location /api/ {
    proxy_pass http://backend:5000;
  }

  # Gambar unggahan
  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_cache_valid 200 1h;
  }

  # Socket.io (notifikasi real-time): wajib upgrade WebSocket
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
  }

  # SPA React: semua rute lain kembali ke index.html
  location / {
    try_files $uri /index.html;
  }
}
