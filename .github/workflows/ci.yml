# CI: pasang dependensi, build frontend, jalankan tes backend. Belum pernah dijalankan di GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decant_temcy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      # DB_NAME dan DB_NAME_TEST HARUS beda: tes menolak berjalan bila sama (pengaman database utama)
      DB_NAME: decant_temcy
      DB_NAME_TEST: decant_temcy_test
      JWT_SECRET: ci-only-secret
      MIDTRANS_SERVER_KEY: ci-midtrans-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Tanpa schema.sql semua tes database akan DILEWATI dan CI tetap hijau. Di CI itu dianggap GAGAL.
      - name: Pastikan schema.sql ada
        working-directory: .
        run: |
          if [ ! -f backend/tests/schema.sql ]; then
            echo "::error::backend/tests/schema.sql tidak ada. Buat dengan: pg_dump --schema-only --no-owner -f backend/tests/schema.sql, lalu commit."
            exit 1
          fi
      - name: Buat database uji
        working-directory: .
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE decant_temcy_test'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --json --outputFile=jest-result.json
      # Di CI tidak boleh ada tes yang dilewati: itu tanda database uji tidak siap
      - name: Pastikan tidak ada tes yang dilewati
        run: node -e "const r=require('./jest-result.json'); if (r.numPendingTests > 0) { console.error('Ada ' + r.numPendingTests + ' tes dilewati (skip)'); process.exit(1) }"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
